name: Build server / client

on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    name: Continuous Integration
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4.0.2
        with:
          node-version: 22

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push server
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          context: ./server
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/sheepwizard/wackywikiraces/server:latest

      - name: Build and push client
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          context: ./client
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/sheepwizard/wackywikiraces/client:latest

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            docker stop wackywikirace || true
            docker rm wackywikirace || true
            docker pull ghcr.io/sheepwizard/wackywikiraces/client:latest
            docker run -d --network nginxproxymanager_default --name=wackywikirace --restart unless-stopped ghcr.io/sheepwizard/wackywikiraces/client:latest
